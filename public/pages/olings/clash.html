                  ></div>
                </div>
              </div>
            </article>
            <div
              class="olings-clash-tag-resource is-opponent"
              data-clash-tag-resource="opponent"
              aria-label="Opponent Tag charges"
              hidden
            >
              <span class="olings-clash-tag-resource__section">
                <span class="olings-clash-tag-resource__label">TAG</span>
                <span
                  class="olings-clash-tag-resource__pips"
                  data-clash-tag-charge-pips
                  aria-hidden="true"
                ></span>
              </span>
              <span
                class="olings-clash-tag-resource__divider"
                data-clash-tag-resource-divider
                aria-hidden="true"
              ></span>
              <span class="olings-clash-tag-resource__section">
                <small class="olings-clash-tag-resource__recharge-label"
                  >DECISIVE</small
                >
                <span
                  class="olings-clash-tag-resource__recharge-pips"
                  data-clash-tag-recharge-pips
                  aria-hidden="true"
                ></span>
              </span>
            </div>
          </section>

          <section class="olings-clash-arena" aria-label="Active Olings">
            <article
              class="olings-clash-fighter is-local"
              data-clash-fighter="local"
            >
              <div class="olings-clash-fighter__art" aria-hidden="true">
                <div class="olings-clash-fighter__motion">
                  <div class="olings-clash-oling-art">
                    <img
                      class="olings-clash-oling-layer is-flight"
                      src="/images/olings/builds/flight/base/moss-wings.svg"
                      alt=""
                    />
                    <img
                      class="olings-clash-oling-layer is-body"
                      src="/images/olings/builds/body/base/moss-body.svg"
                      alt=""
                    />
                    <img
                      class="olings-clash-oling-layer is-eyes"
                      src="/images/olings/builds/eyes/base/moss-eyes.svg"
                      alt=""
                    />
                    <img
                      class="olings-clash-oling-layer is-mouth"
                      src="/images/olings/builds/mouth/base/moss-mouth.svg"
                      alt=""
                    />
                  </div>
                </div>
              </div>
            </article>

            <article
              class="olings-clash-fighter is-opponent"
              data-clash-fighter="opponent"
            >
              <div
                class="olings-clash-fighter__art"
                role="button"
                tabindex="-1"
                aria-disabled="true"
                aria-label="Select an ability before targeting the opponent"
                data-clash-action-confirm-target
              >
                <div class="olings-clash-fighter__motion">
                  <div class="olings-clash-oling-art">
                    <img
                      class="olings-clash-oling-layer is-flight"
                      src="/images/olings/builds/flight/base/vampire-wings.svg"
                      alt=""
                    />
                    <img
                      class="olings-clash-oling-layer is-body"
                      src="/images/olings/builds/body/base/vampire-body.svg"
                      alt=""
                    />
                    <img
                      class="olings-clash-oling-layer is-eyes"
                      src="/images/olings/builds/eyes/base/vampire-eyes.svg"
                      alt=""
                    />
                    <img
                      class="olings-clash-oling-layer is-mouth"
                      src="/images/olings/builds/mouth/base/vampire-mouth.svg"
                      alt=""
                    />
                  </div>
                </div>
              </div>
            </article>
          </section>

          <section
            class="olings-clash-actions"
            aria-label="Clash actions"
            data-clash-actions
          >
            <div
              class="olings-clash-action-summary"
              data-clash-action-summary
              aria-live="polite"
              aria-hidden="true"
            ></div>
            <div class="olings-clash-actions__choices">
              <button
                class="olings-clash-action is-attack"
                type="button"
                aria-label="Attack: Mend"
                data-clash-action="attack"
              >
                <img
                  src="/images/olings/clash/abilities/moss/mend.svg"
                  alt=""
                  data-clash-move-image
                />
                <strong data-clash-move-name>MEND</strong>
              </button>
              <button
                class="olings-clash-action is-guard"
                type="button"
                aria-label="Guard: Cleanse"
                data-clash-action="guard"
              >
                <img
                  src="/images/olings/clash/abilities/moss/cleanse.svg"
                  alt=""
                  data-clash-move-image
                />
                <strong data-clash-move-name>CLEANSE</strong>
              </button>
              <button
                class="olings-clash-action is-skill"
                type="button"
                aria-label="Skill: Wild Growth"
                data-clash-action="skill"
              >
                <img
                  src="/images/olings/clash/abilities/moss/wild-growth.svg"
                  alt=""
                  data-clash-move-image
                />
                <strong data-clash-move-name>WILD GROWTH</strong>
              </button>
              <button
                class="olings-clash-action is-draw is-passive"
                type="button"
                aria-label="Draw passive: Canopy"
                data-clash-action="draw"
                data-clash-passive
              >
                <img
                  src="/images/olings/clash/abilities/moss/canopy.svg"
                  alt=""
                  data-clash-move-image
                />
                <strong data-clash-move-name>CANOPY</strong>
              </button>
            </div>
            <button
              class="olings-clash-action-confirm"
              type="button"
              data-clash-action-confirm
              disabled
            >
              CONFIRM
            </button>
          </section>

          <section
            class="olings-clash-picker"
            data-clash-picker
            role="dialog"
            aria-modal="true"
            aria-hidden="true"
            hidden
          >
            <header class="olings-clash-picker__header">
              <h2 data-clash-picker-title>CHOOSE AN OLING</h2>
            </header>
            <p
              class="olings-clash-picker__description"
              data-clash-picker-description
              hidden
            ></p>
            <div
              class="olings-clash-picker__options"
              data-clash-picker-options
            ></div>
            <div
              class="olings-clash-picker__choices"
              data-clash-picker-choices
              role="radiogroup"
              aria-label="Effect option"
              hidden
            ></div>
            <button
              class="olings-clash-picker__confirm"
              type="button"
              data-clash-picker-confirm
              disabled
            >
              CONFIRM
            </button>
          </section>

          <div
            class="olings-clash-inspector-backdrop"
            data-clash-inspector
            aria-hidden="true"
            hidden
          >
            <section
              class="olings-clash-inspector"
              role="dialog"
              aria-modal="true"
              aria-labelledby="olings-clash-inspector-title"
              tabindex="-1"
            >
              <header class="olings-clash-inspector-header">
                <div class="olings-clash-inspector-header__identity">
                  <small data-clash-inspector-position></small>
                </div>
              </header>
              <div
                class="olings-clash-inspector-content"
                data-clash-inspector-content
              ></div>
            </section>
          </div>

          <section
            class="olings-clash-end-game"
            role="dialog"
            aria-modal="true"
            aria-labelledby="olings-clash-end-result"
            aria-live="polite"
            data-clash-end-game
            hidden
          >
            <div class="olings-clash-end-game__card">
              <header class="olings-clash-end-game__result">
                <strong id="olings-clash-end-result" data-clash-end-result
                  >CLASH COMPLETE</strong
                >
                <small data-clash-end-detail></small>
              </header>
              <div class="olings-clash-end-game__matchup">
                <article
                  class="olings-clash-end-game__player is-local"
                  data-clash-end-player="local"
                >
                  <div
                    class="olings-clash-end-game__oe"
                    data-clash-end-player-oe
                    aria-hidden="true"
                  ></div>
                  <span data-clash-end-player-name>YOU</span>
                </article>
                <strong class="olings-clash-end-game__versus">VS</strong>
                <article
                  class="olings-clash-end-game__player is-opponent"
                  data-clash-end-player="opponent"
                >
                  <div
                    class="olings-clash-end-game__oe"
                    data-clash-end-player-oe
                    aria-hidden="true"
                  ></div>
                  <span data-clash-end-player-name>OPPONENT</span>
                </article>
              </div>
            </div>

            <section
              class="olings-clash-match-controls"
              aria-label="Completed match controls"
              data-clash-match-controls
              hidden
            >
              <button type="button" data-clash-rematch>REMATCH</button>
              <button type="button" data-clash-back-lobby>BACK TO LOBBY</button>
              <a href="/">MAIN MENU</a>
            </section>
          </section>
        </div>
      </section>

      <section
        class="olings-clash-forfeit-dialog"
        role="alertdialog"
        aria-modal="true"
        aria-labelledby="olings-clash-forfeit-title"
        aria-describedby="olings-clash-forfeit-copy"
        data-clash-forfeit-dialog
        hidden
      >
        <div class="olings-clash-forfeit-dialog__card">
          <p
            class="olings-clash-forfeit-dialog__eyebrow"
            data-clash-forfeit-eyebrow
          >
            MATCH OPTIONS
          </p>
          <h2 id="olings-clash-forfeit-title" data-clash-forfeit-title>
            FORFEIT THIS CLASH?
          </h2>
          <p id="olings-clash-forfeit-copy" data-clash-forfeit-copy>
            This will end the match immediately and count as a loss.
          </p>
          <p
            class="olings-clash-forfeit-dialog__status"
            role="status"
            data-clash-forfeit-status
            hidden
          ></p>
          <div class="olings-clash-forfeit-dialog__actions">
            <button type="button" data-clash-forfeit-cancel>
              KEEP PLAYING
            </button>
            <button
              class="is-destructive"
              type="button"
              data-clash-forfeit-confirm
            >
              FORFEIT CLASH
            </button>
          </div>
        </div>
      </section>
    </main>
  </body>
  <script>
    window.allowTransition = true;
    window.splashScreenExitDirection = 'down';

    document.documentElement.style.setProperty(
      '--primarypagecolour',
      '#5D9EF5'
    );
    document.documentElement.style.setProperty(
      '--secondarypagecolour',
      '#3869B8'
    );

    const clashPath = window.location.pathname;
    const isClashTutorial = /^\/olings\/clash\/tutorial\/?$/i.test(clashPath);
    const isClashRoom = /^\/olings\/clash\/[a-z0-9]{3}-[a-z0-9]{3}\/?$/i.test(
      clashPath
    );
    const offlineMatchCode = window.sessionStorage.getItem(
      'olings-clash-offline-match'
    );
    const isServerMatch =
      isClashRoom || (!isClashTutorial && Boolean(offlineMatchCode));
    document
      .querySelector('[data-clash-game]')
      ?.toggleAttribute('data-clash-online', isServerMatch);

    // Production Clash ships as one ordered, minified core bundle. Debug tools
    // stay available when developing locally without entering production builds.
    window.pageScripts = {
      '/build/olings/clash/clash-core.js': {
        addDataLoaded: true,
        cacheBustKey: 'OLING_CLASH',
        zIndex: 19
      }
    };
    if (
      /^(?:localhost|127\.0\.0\.1|\[::1\])$/i.test(window.location.hostname)
    ) {
      window.pageScripts['/scripts/olings/clash/game/debug.js'] = {
        cacheBustKey: 'OLING_CLASH_DEBUG',
        zIndex: 18
      };
    }

    if (isServerMatch) {
      window.pageScripts['https://cdn.socket.io/4.8.1/socket.io.min.js'] = {
        external: true,
        zIndex: 0
      };
      window.pageScripts['/build/olings/clash/clash-online.js'] = {
        addDataLoaded: true,
        cacheBustKey: 'OLING_CLASH',
        zIndex: 20
      };
    }

    if (isClashTutorial) {
      [
        '/css/general/tutorial/tutorial.css',
        '/css/olings/clash/tutorial/clash-tutorial.css'
      ].forEach((href) => {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = href;
        document.head.appendChild(link);
      });
      Object.assign(window.pageScripts, {
        '/build/olings/clash/clash-tutorial.js': {
          cacheBustKey: 'OLING_CLASH',
          zIndex: 23
        }
      });
    }
    window.pageLoadStageLabels = {
      '/scripts/html-templates/core-template/core-template.js':
        'Loading page shell',
      '/build/olings/clash/clash-core.js': 'Preparing battle engine',
      '/build/olings/clash/clash-online.js': 'Connecting to match',
      '/build/olings/clash/clash-tutorial.js': 'Preparing guided lesson',
      default: 'Preparing Clash',
      ready: 'Clash ready'
    };
    document.querySelector('#splash-screen-container p').textContent =
      'Loading page shell';
  </script>
  <script
    src="/scripts/html-templates/core-template/core-template.js"
    data-loaded="false"
  ></script>
</html>
