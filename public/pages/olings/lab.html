  <body>
    <div id="header-placeholder"></div>

    <main class="oling-lab-page" data-template="oling-lab">
      <section class="oling-lab-toolbar" aria-label="Olings Lab controls">
        <p id="oling-lab-save-status" class="oling-lab-save-status">
          Loading lab...
        </p>
        <button
          class="oling-lab-edit-toggle"
          id="oling-lab-edit-toggle"
          type="button"
          aria-pressed="false"
        >
          Edit
        </button>
      </section>

      <section class="oling-lab-stage" aria-label="Olings Lab room">
        <button
          class="oling-lab-scroll oling-lab-scroll--left"
          id="oling-lab-scroll-left"
          type="button"
          aria-label="Scroll lab left"
        >
          ‹
        </button>
        <div class="oling-lab-viewport" id="oling-lab-viewport">
          <div
            class="oling-lab-room"
            id="oling-lab-room"
            aria-live="polite"
          ></div>
        </div>
        <button
          class="oling-lab-scroll oling-lab-scroll--right"
          id="oling-lab-scroll-right"
          type="button"
          aria-label="Scroll lab right"
        >
          ›
        </button>
      </section>
    </main>

    <div class="oling-lab-menu-backdrop" id="oling-lab-menu-backdrop" hidden>
      <section
        class="oling-lab-menu"
        role="dialog"
        aria-modal="true"
        aria-labelledby="oling-lab-menu-title"
      >
        <nav
          class="oling-lab-menu-tabs"
          id="oling-lab-menu-tabs"
          aria-label="Menu sections"
          hidden
        ></nav>
        <header class="oling-lab-menu-header">
          <h2 id="oling-lab-menu-title">Lab Item</h2>
        </header>
        <div class="oling-lab-menu-content" id="oling-lab-menu-content"></div>
        <footer
          class="oling-lab-menu-footer"
          id="oling-lab-menu-footer"
        ></footer>
      </section>
    </div>
  </body>
