    <style id="protected-page-critical">
      html,
      body {
        min-height: 100%;
        margin: 0;
        overflow: hidden;
        background: #202020;
        color: #FFF0E8;
      }

      .protected-page {
        display: none;
      }

      .protected-splash {
        position: fixed;
        inset: 0;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 9999;
        display: grid;
        min-height: 100dvh;
        place-items: center;
        padding: clamp(1rem, 5vw, 4rem);
        box-sizing: border-box;
        background: #202020;
        isolation: isolate;
        transition: none;
        transform: none;
        overflow: hidden;
      }

      .protected-splash.center,
      .protected-splash.down,
      .protected-splash.up {
        top: 0;
      }

      .protected-splash > img {
        position: absolute;
        inset: 0;
        z-index: -2;
        display: block;
        width: 100%;
        max-width: none;
        height: 100%;
        max-height: none;
        object-fit: cover;
        object-position: center;
        filter: brightness(0.64);
      }

      .protected-splash::after {
        position: absolute;
        inset: 0;
        z-index: -1;
        content: '';
        background: rgba(32, 32, 32, 0.32);
      }

      .protected-page-message {
        position: relative;
        z-index: 5;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: min(48rem, 100%);
        text-align: center;
      }

      .protected-page-eyebrow {
        order: 1;
        position: static;
        width: auto;
        margin: 0 0 1rem;
        padding: 0;
        color: #FFF0E8;
        font: 900 clamp(0.72rem, 1.4vw, 0.95rem) Arial, sans-serif;
        letter-spacing: 0;
        text-align: center;
        text-transform: uppercase;
      }

      .protected-page-message h1 {
        order: 2;
        margin: 0;
        color: #FFF0E8;
        font: 900 clamp(2.2rem, 7vw, 5.2rem) / 0.92 Arial, sans-serif;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .protected-page-message p:not(.protected-page-eyebrow) {
        order: 3;
        position: static;
        width: min(34rem, 100%);
        margin: 1.25rem auto 0;
        padding: 0;
        color: #FFF0E8;
        font: 300 clamp(0.85rem, 1.8vw, 1.08rem) / 1.35 Arial, sans-serif;
        text-align: center;
      }

      .protected-page-actions {
        order: 4;
        position: relative;
        z-index: 6;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
        margin-top: 1.6rem;
      }

      .protected-page-action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        padding: 0 1.15rem;
        border: 2px solid transparent;
        background: #FFF0E8;
        color: #202020;
        font: 900 0.9rem / 1 Arial, sans-serif;
        letter-spacing: 0;
        text-decoration: none;
        text-transform: uppercase;
      }

      .protected-splash .protected-page-message > .protected-page-eyebrow,
      .protected-splash .protected-page-message > p:not(.protected-page-eyebrow) {
        position: static;
        bottom: auto;
        width: auto;
        margin-left: 0;
        padding: 0;
        text-align: center;
      }

      .protected-splash .protected-page-message > p:not(.protected-page-eyebrow) {
        width: min(34rem, 100%);
        margin: 1.25rem auto 0;
      }

      .protected-access-page .oe-bodyguard {
        position: fixed;
        left: 0;
        bottom: -3rem;
        width: min(36rem, 82vw);
        height: calc(min(36rem, 82vw) * 4 / 3);
        transform: translateX(-115%) rotate(15deg);
        transform-origin: bottom left;
        z-index: 2;
      }
    </style>
