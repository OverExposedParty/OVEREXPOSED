    document.documentElement.style.setProperty(

      '#66CCFF'
    );
    document.documentElement.style.setProperty(
      '--secondarypagecolour',
      '#427BB9'
    );

    window.pageScripts = {
      '/scripts/shop/product-page/product-page.js': {
        addDataLoaded: true,
        cacheBustKey: 'OTHER',
        zIndex: 0
      }
    };
