<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Security-Policy"
        content="connect-src 'self' https://overexposed.app:3000 https://www.google-analytics.com https://*.google-analytics.com https://cdn.socket.io;
             script-src 'self' https://code.responsivevoice.org/ https://www.googletagmanager.com https://cdn.socket.io https://overexposed.app:3000 'unsafe-inline';">

    <title>OE Library | OVEREXPOSED</title>
    <meta name="description"
        content="Browse, manage, and unlock Overexposed Entity (OE) customisation items on OVEREXPOSED.">
    <meta name="author" content="OVEREXPOSED">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="OE Library | OVEREXPOSED">
    <meta property="og:description"
        content="Browse, manage, and unlock Overexposed Entity (OE) customisation items on OVEREXPOSED.">
    <meta property="og:image" content="/images/meta/og-images/overexposed-entities-customisation.jpg">
    <meta property="og:url" content="https://overexposed.app/oe-library/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="OE Library | OVEREXPOSED">
    <meta name="twitter:description"
        content="Browse, manage, and unlock Overexposed Entity (OE) customisation items on OVEREXPOSED.">
    <meta name="twitter:image" content="/images/meta/og-images/overexposed-entities-customisation.jpg">
    <link rel="canonical" href="https://overexposed.app/oe-library/">

    <link rel="preload" href="/images/splash-screens/oes-customisation.png" as="image">

    <link rel="stylesheet" href="/css/general/header/header.css">
    <link rel="stylesheet" href="/css/other/oes-customisation-page.css">

    <link rel="icon" type="image/x-icon" href="/images/meta/favicons/oes-customisation/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16"
        href="/images/meta/favicons/oes-customisation/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32"
        href="/images/meta/favicons/oes-customisation/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/images/meta/favicons/oes-customisation/apple-touch-icon.png">
    <link rel="manifest" href="/images/meta/favicons/oes-customisation/site.webmanifest">
</head>

<body>
    <section class="sr-only" aria-label="OE library SEO content">
        <h1>OE Library</h1>
        <h2>Browse OE Customisation</h2>
        <p>Browse Overexposed Entity (OE) customisation items, manage disabled OEs, and view locked or unlocked avatar parts on OVEREXPOSED.</p>
    </section>
    <div class="splash-screen-container-static" id="splash-screen-container-static">
        <img src="/images/splash-screens/oes-customisation.png" alt="Splash Screen">
    </div>
    <div class="splash-screen-container" id="splash-screen-container">
        <img src="/images/splash-screens/oes-customisation.png" alt="Splash Screen">
        <p></p>
    </div>

    <div id="header-placeholder"></div>

    <main class="oe-library-page" data-template="oes-customisation">
        <header class="oe-library-header">
            <div>
                <h1>OE Library</h1>
                <p class="oe-library-status" aria-live="polite">Loading OEs...</p>
            </div>
        </header>

        <section class="oe-library-toolbar" aria-label="OE library filters">
            <label class="oe-library-search">
                <span class="sr-only">Search OEs</span>
                <input id="oe-library-search" type="search" placeholder="Search OEs">
            </label>
            <div class="oe-library-collection-filter" id="oe-library-collection-filter">
                <button class="oe-library-collection-button" id="oe-library-collection-button" type="button"
                    aria-expanded="false" aria-controls="oe-library-collection-menu">
                    All collections
                </button>
                <div class="oe-library-collection-menu" id="oe-library-collection-menu" hidden></div>
            </div>
            <select id="oe-library-slot-filter" class="oe-library-select" aria-label="Filter by slot">
                <option value="all">All slots</option>
                <option value="colour">Colours</option>
                <option value="head-slot">Head</option>
                <option value="eyes-slot">Eyes</option>
                <option value="mouth-slot">Mouth</option>
            </select>
            <select id="oe-library-ownership-filter" class="oe-library-select" aria-label="Filter by ownership">
                <option value="all">All ownership</option>
                <option value="unlocked">Unlocked</option>
                <option value="locked">Locked</option>
                <option value="disabled">Disabled</option>
            </select>
            <button id="oe-library-show-locked" class="oe-library-lock-toggle" type="button"
                aria-pressed="true" aria-label="Hide locked OEs"></button>
        </section>

        <section class="oe-library-grid" aria-label="OE items"></section>
    </main>

    <button class="back-button">BACK</button>
</body>

<script>
    document.documentElement.style.setProperty('--primarypagecolour', '#F6C86D');
    document.documentElement.style.setProperty('--secondarypagecolour', '#C29B50');

    window.pageScripts = {
        "/scripts/other/oes-customisation/library-data.js": { zIndex: 0 },
        "/scripts/other/oes-customisation/purchase-dialog.js": { zIndex: 0.1 },
        "/scripts/other/oes-customisation/library-view.js": { zIndex: 0.2 },
        "/scripts/other/oes-customisation/oes-customisation.js": { addDataLoaded: true, zIndex: 1 }
    };

</script>
<script src="/scripts/html-templates/core-template/core-template.js" data-loaded="false"></script>
</html>
