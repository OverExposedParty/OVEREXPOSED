<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Reset Password | OVEREXPOSED</title>
    <meta name="description" content="Reset your OVEREXPOSED password." />
    <meta name="author" content="OVEREXPOSED" />
    <meta name="robots" content="noindex, follow" />

    <link rel="stylesheet" href="/css/general/header/header.css" />
    <link rel="stylesheet" href="/css/auth/login.css" />

    <link
      id="favicon-ico"
      rel="icon"
      type="image/x-icon"
      href="/images/meta/favicons/party-games/truth-or-dare/lobby/favicon.ico"
    />
    <link
      id="favicon-16"
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/images/meta/favicons/party-games/truth-or-dare/lobby/favicon-16x16.png"
    />
    <link
      id="favicon-32"
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/images/meta/favicons/party-games/truth-or-dare/lobby/favicon-32x32.png"
    />
    <link
      id="favicon-apple"
      rel="apple-touch-icon"
      href="/images/meta/favicons/party-games/truth-or-dare/lobby/apple-touch-icon.png"
    />
    <link
      id="favicon-manifest"
      rel="manifest"
      href="/images/meta/favicons/party-games/truth-or-dare/lobby/site.webmanifest"
    />
  </head>

  <body>
    <div
      class="splash-screen-container-static"
      id="splash-screen-container-static"
    >
      <img
        src="/images/splash-screens/overexposed.png"
        alt="Splash Screen"
        loading="eager"
      />
    </div>
    <div class="splash-screen-container" id="splash-screen-container">
      <img
        src="/images/splash-screens/overexposed.png"
        alt="Splash Screen"
        loading="eager"
      />
      <p></p>
    </div>

    <div id="header-placeholder"></div>

    <main class="auth-page" data-template="auth">
      <section class="auth-shell" aria-labelledby="auth-title">
        <div class="auth-form-panel">
          <h1 id="auth-title" class="auth-title">
            <span id="auth-title-text" class="auth-title-text"
              >RESET PASSWORD</span
            >
          </h1>

          <form class="auth-form active" id="reset-password-form" novalidate>
            <div class="auth-field">
              <label for="reset-password">NEW PASSWORD</label>
              <div class="auth-password-control">
                <input
                  id="reset-password"
                  name="password"
                  type="password"
                  autocomplete="new-password"
                  minlength="8"
                  maxlength="128"
                  required
                />
                <button
                  class="auth-password-toggle"
                  type="button"
                  data-password-toggle
                  aria-controls="reset-password"
                  aria-label="Show password"
                >
                  <svg
                    class="auth-password-eye auth-password-eye-open"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                  >
                    <path
                      d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"
                    />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                  <svg
                    class="auth-password-eye auth-password-eye-off"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                  >
                    <path d="M3 3l18 18" />
                    <path
                      d="M2.5 12s3.5-6 9.5-6c2 0 3.7.7 5.1 1.6"
                    />
                    <path
                      d="M21.5 12s-3.5 6-9.5 6c-2 0-3.7-.7-5.1-1.6"
                    />
                    <path d="M9.9 9.9A3 3 0 0 0 14.1 14.1" />
                  </svg>
                </button>
              </div>
            </div>

            <div class="auth-field">
              <label for="reset-confirm-password">CONFIRM PASSWORD</label>
              <div class="auth-password-control">
                <input
                  id="reset-confirm-password"
                  name="confirmPassword"
                  type="password"
                  autocomplete="new-password"
                  minlength="8"
                  maxlength="128"
                  required
                />
                <button
                  class="auth-password-toggle"
                  type="button"
                  data-password-toggle
                  aria-controls="reset-confirm-password"
                  aria-label="Show password"
                >
                  <svg
                    class="auth-password-eye auth-password-eye-open"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                  >
                    <path
                      d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"
                    />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                  <svg
                    class="auth-password-eye auth-password-eye-off"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                  >
                    <path d="M3 3l18 18" />
                    <path
                      d="M2.5 12s3.5-6 9.5-6c2 0 3.7.7 5.1 1.6"
                    />
                    <path
                      d="M21.5 12s-3.5 6-9.5 6c-2 0-3.7-.7-5.1-1.6"
                    />
                    <path d="M9.9 9.9A3 3 0 0 0 14.1 14.1" />
                  </svg>
                </button>
              </div>
            </div>

            <button class="auth-submit-button" type="submit">
              SAVE NEW PASSWORD
            </button>
            <a class="auth-secondary-link" href="/sign-in">BACK TO SIGN IN</a>
          </form>

          <p
            class="auth-status"
            id="auth-status"
            role="status"
            aria-live="polite"
          ></p>
        </div>
      </section>
    </main>
  </body>
  <script>
    document.documentElement.style.setProperty(
      '--primarypagecolour',
      '#66CCFF'
    );
    document.documentElement.style.setProperty(
      '--secondarypagecolour',
      '#427BB9'
    );

    window.pageScripts = {
      '/scripts/auth/reset-password/reset-password.js': {
        addDataLoaded: true,
        cacheBustKey: 'PASSWORD_RESET',
        zIndex: 0
      }
    };
  </script>
  <script
    src="/scripts/html-templates/core-template/core-template.js"
    data-loaded="false"
  ></script>
</html>
