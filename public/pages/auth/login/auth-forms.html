  <div class="auth-field">
    <label for="login-identifier">EMAIL OR USERNAME</label>
    <input
      id="login-identifier"
      name="identifier"
      type="text"
      autocomplete="username"
      autocapitalize="none"
      spellcheck="false"
      data-lowercase
      required
    />
  </div>

  <div class="auth-field">
    <label for="login-password">PASSWORD</label>

        name="password"
        type="password"
        autocomplete="current-password"
        required

          <path d="M9.9 9.9A3 3 0 0 0 14.1 14.1" />
        </svg>
      </button>
    </div>
  </div>

  <button

<form
  class="auth-form"
  id="password-reset-request-form"
  data-auth-form="reset"
  novalidate
>
  <div class="auth-field">
    <label for="password-reset-identifier">EMAIL OR USERNAME</label>
    <input
      id="password-reset-identifier"
      name="identifier"
      type="text"
      autocomplete="username"
      autocapitalize="none"
      spellcheck="false"
      data-lowercase
      required
    />
  </div>

  <button class="auth-submit-button" type="submit">SEND RESET LINK</button>
  <button class="auth-guest-button" id="back-to-login-button" type="button">
    BACK TO SIGN IN
  </button>
</form>

<form class="auth-form" id="signup-form" data-auth-form="signup" novalidate>
  <div class="auth-field">
    <label for="signup-username">USERNAME</label>
    <input
      id="signup-username"
      name="username"
      type="text"
      autocomplete="username"
      autocapitalize="none"
      spellcheck="false"
      pattern="[a-z0-9_.-]{3,30}"
      data-lowercase
      minlength="3"
      maxlength="30"
      required
    />
  </div>

  <div class="auth-field">
    <label for="signup-email">EMAIL</label>
    <input
      id="signup-email"
      name="email"
      type="email"
      autocomplete="email"
      autocapitalize="none"
      spellcheck="false"
      data-lowercase
      maxlength="254"
      required
    />
  </div>

  <div class="auth-field">
    <label for="signup-password">PASSWORD</label>
    <div class="auth-password-control">
      <input
        id="signup-password"
        name="password"
        type="password"
        autocomplete="new-password"
        minlength="8"
        maxlength="128"
        required
      />
      <button
        class="auth-password-toggle"
        type="button"
        data-password-toggle
        aria-controls="signup-password"
        aria-label="Show password"
      >
        <svg
          class="auth-password-eye auth-password-eye-open"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >

          <path d="M2.5 12s3.5-6 9.5-6c2 0 3.7.7 5.1 1.6" />

          <path d="M9.9 9.9A3 3 0 0 0 14.1 14.1" />
        </svg>
      </button>
    </div>
  </div>

  <div class="auth-field">
    <label for="signup-confirm-password">CONFIRM PASSWORD</label>
    <div class="auth-password-control">
      <input
        id="signup-confirm-password"
        name="confirmPassword"
        type="password"
        autocomplete="new-password"
        minlength="8"
        maxlength="128"
        required
      />
      <button
        class="auth-password-toggle"
        type="button"
        data-password-toggle
        aria-controls="signup-confirm-password"
        aria-label="Show password"
      >
        <svg
          class="auth-password-eye auth-password-eye-open"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" />

          aria-hidden="true"

          <path d="M3 3l18 18" />
          <path d="M2.5 12s3.5-6 9.5-6c2 0 3.7.7 5.1 1.6" />
          <path d="M21.5 12s-3.5 6-9.5 6c-2 0-3.7-.7-5.1-1.6" />
          <path d="M9.9 9.9A3 3 0 0 0 14.1 14.1" />
        </svg>
      </button>
    </div>
  </div>

  <div class="auth-check">
    <input id="signup-terms" name="terms" type="checkbox" required />
    <div class="auth-legal-consent-copy">
      <span>
        <label for="signup-terms">I agree to the</label>
        <button class="auth-legal-link" type="button" data-legal-open="terms">
          Terms of Service
        </button>
        <label for="signup-terms">and acknowledge the</label>
        <button class="auth-legal-link" type="button" data-legal-open="privacy">
          Privacy Policy</button
        >.
      </span>
      <span class="auth-legal-version" id="auth-legal-version"
        >Loading current version…</span
      >
    </div>
  </div>

  <div class="auth-check auth-marketing-consent">
    <input
      id="signup-marketing-email"

    />
