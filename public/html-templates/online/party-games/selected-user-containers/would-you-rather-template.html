<div class="selected-user-container " id="select-option-container" data-container-open-sound="partyGameChoiceMenuOpen">
    <div class="content-container">
        <h1>WOULD YOU RATHER</h1>
    </div>
    <div class="content-container">
        <h2 id="a"></h2>
    </div>
    <div class="content-container">
        <h2 id="b"></h2>
    </div>
    <div class="select-button-container">
        <button class="select-button sound-option" id="a">A</button>
        <button class="select-button sound-option" id="b">B</button>
    </div>
</div>

<div class="selected-user-container next-round-join-container" id="next-round-join-container">
    <div class="content-container next-round-join-copy">
        <h1>GAME IN PROGRESS: YOU'LL JOIN NEXT QUESTION</h1>
        <div class="next-round-join-timeline-shell" aria-label="Current question timeline">
            <div class="next-round-join-timeline" id="next-round-join-timeline"></div>
        </div>
        <p>This question has already started. You'll be added automatically when the next question begins.</p>
    </div>
</div>
