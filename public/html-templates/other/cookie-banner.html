<div
  class="cookie-banner"
  id="cookie-banner"
  role="region"
  aria-labelledby="cookie-consent-title"
>
  <div class="cookie-container cookie-header">
    <h2 id="cookie-consent-title">WE USE COOKIES</h2>
  </div>
  <div class="cookie-container cookie-content">
    <p>
      We use optional Google Analytics cookies to understand site traffic and
      improve your experience. Selecting “Accept” allows analytics storage;
      selecting “Decline” keeps it disabled. Learn more in our
      <a href="/terms-and-privacy" target="_blank" rel="noopener noreferrer"
        >Terms &amp; Privacy</a
      >.
    </p>
  </div>
  <div class="cookie-button-container">
    <button id="accept-cookies" type="button">ACCEPT</button>
    <button id="decline-cookies" type="button">DECLINE</button>
  </div>
</div>
